<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Item Finder</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <main>
    <h1>Item Finder</h1>
    <p class="subtitle">Search Craigslist listings across local markets.</p>

    <form id="search-form">
      <div class="form-group">
        <label for="query">What are you looking for?</label>
        <input
          type="text"
          id="query"
          name="query"
          placeholder="e.g. vintage leather couch"
          required
          autocomplete="off"
        />
      </div>

      <div class="form-group">
        <div class="markets-header">
          <label>Craigslist markets</label>
          <span id="market-count" class="market-count">0 / 3 selected</span>
        </div>
        <div class="markets-list" id="markets-list">
          {% for subdomain, label in markets %}
          <label class="market-option">
            <input type="checkbox" name="markets" value="{{ subdomain }}" />
            {{ label }}
          </label>
          {% endfor %}
        </div>
      </div>

      <button type="submit" id="submit-btn">Search</button>
    </form>

    <section id="saved-section">
      <h2 class="saved-heading">Saved searches</h2>
      <div id="saved-list">
        <p id="saved-empty" class="saved-empty">No saved searches yet.</p>
      </div>
    </section>

    <section id="results-section" hidden>
      <div class="results-header">
        <h2>Results</h2>
        <div id="save-bar" hidden>
          <input type="text" id="save-name" placeholder="Name this search to save it…" maxlength="80" />
          <button id="save-btn" type="button">Save</button>
        </div>
      </div>

      <div id="filter-sort-bar">
        <div class="filter-row">
          <div class="filter-group">
            <label for="price-filter">Max price</label>
            <select id="price-filter">
              <option value="">Any price</option>
              <option value="0">Free ($0)</option>
              <option value="1">Up to $25</option>
              <option value="2">Up to $50</option>
              <option value="3">Up to $100</option>
              <option value="4">Up to $250</option>
              <option value="5">Up to $500</option>
              <option value="6">Up to $1,000</option>
              <option value="7">Up to $2,500</option>
              <option value="8">Up to $5,000</option>
              <option value="9">Up to $10,000</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="age-filter">Max age</label>
            <select id="age-filter">
              <option value="">Any age</option>
              <option value="0">Today</option>
              <option value="1">Last 2 days</option>
              <option value="2">Last 3 days</option>
              <option value="3">Last week</option>
              <option value="4">Last 2 weeks</option>
              <option value="5">Last month</option>
              <option value="6">Last 2 months</option>
              <option value="7">Last 3 months</option>
              <option value="8">Last 6 months</option>
              <option value="9">Last year</option>
            </select>
          </div>
        </div>
        <div id="market-filter-row" class="filter-row" hidden>
          <div class="filter-group filter-group--full">
            <span class="filter-label">Market</span>
            <div id="market-filter-chips" class="filter-chips"></div>
          </div>
        </div>
      </div>

      <div id="seen-toggle-bar" hidden>
        <button id="seen-toggle-btn" type="button"></button>
      </div>
      <p id="result-count"></p>
      <div class="table-wrapper">
        <table id="results-table">
          <thead>
            <tr>
              <th data-col="title">Name <span class="sort-arrow"></span></th>
              <th data-col="price">Price <span class="sort-arrow"></span></th>
              <th data-col="date">Date Posted <span class="sort-arrow"></span></th>
              <th data-col="market">Market <span class="sort-arrow"></span></th>
            </tr>
          </thead>
          <tbody id="results-body"></tbody>
        </table>
      </div>
    </section>

    <p id="error-msg" class="error" hidden></p>
  </main>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
